name: Transmitter GUI Release

on:
  push:
    tags:
      - "transmitter-gui-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            asset_name: Walach-Aviation-Transmitter-Configurator-macOS-ARM64.zip
            build_cmd: python -m PyInstaller --clean --noconfirm "Walach Aviation Transmitter Configurator.spec"
            package_cmd: ditto -c -k --sequesterRsrc --keepParent "dist/Walach Aviation Transmitter Configurator.app" "Walach-Aviation-Transmitter-Configurator-macOS-ARM64.zip"
          - name: Windows
            os: windows-latest
            asset_name: Walach-Aviation-Transmitter-Configurator-Windows-x64.zip
            build_cmd: pyinstaller --clean --noconfirm --onefile --windowed --name "WalachTransmitterConfigurator" fram_gui_models.py
            package_cmd: Compress-Archive -Path "dist/WalachTransmitterConfigurator.exe" -DestinationPath "Walach-Aviation-Transmitter-Configurator-Windows-x64.zip" -Force
          - name: Raspberry Pi ARM64
            os: ubuntu-24.04-arm
            asset_name: Walach-Aviation-Transmitter-Configurator-Raspberry-Pi-ARM64.zip
            build_cmd: pyinstaller --clean --noconfirm --onefile --windowed --name "Walach Aviation Transmitter Configurator" fram_gui_models.py
            package_cmd: zip -j "Walach-Aviation-Transmitter-Configurator-Raspberry-Pi-ARM64.zip" "dist/Walach Aviation Transmitter Configurator"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk zip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build app
        run: ${{ matrix.build_cmd }}

      - name: Package app
        run: ${{ matrix.package_cmd }}

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Determine release tag
        id: release_tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" release-assets/*.zip \
            --title "Transmitter GUI ${RELEASE_TAG#transmitter-gui-v}" \
            --notes "Transmitter GUI builds for macOS ARM64, Windows x64, and Raspberry Pi OS ARM64."
