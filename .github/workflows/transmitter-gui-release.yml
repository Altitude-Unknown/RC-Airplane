name: Altitude Unknown RC Configurator Release

on:
  push:
    tags:
      - "transmitter-gui-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            asset_name: Altitude-Unknown-RC-Configurator-macOS-ARM64.zip
            build_cmd: python -m PyInstaller --clean --noconfirm "Altitude Unknown RC Configurator.spec"
            package_cmd: ditto -c -k --sequesterRsrc --keepParent "dist/Altitude Unknown RC Configurator.app" "Altitude-Unknown-RC-Configurator-macOS-ARM64.zip"
            app_path: dist/Altitude Unknown RC Configurator.app
          - name: Windows
            os: windows-latest
            asset_name: Altitude-Unknown-RC-Configurator-Windows-x64.zip
            build_cmd: pyinstaller --clean --noconfirm --collect-all esptool --add-data "assets/altitude_unknown_icon.png;assets" --add-binary "tools/bossac.exe;tools" --icon "assets/altitude_unknown_icon.png" --onefile --windowed --name "AltitudeUnknownRCConfigurator" fram_gui_models.py
            package_cmd: Compress-Archive -Path "dist/AltitudeUnknownRCConfigurator.exe" -DestinationPath "Altitude-Unknown-RC-Configurator-Windows-x64.zip" -Force
          - name: Raspberry Pi ARM64
            os: ubuntu-24.04-arm
            asset_name: Altitude-Unknown-RC-Configurator-Raspberry-Pi-ARM64.zip
            build_cmd: pyinstaller --clean --noconfirm --collect-all esptool --add-data "assets/altitude_unknown_icon.png:assets" --add-binary "tools/bossac:tools" --icon "assets/altitude_unknown_icon.png" --onefile --windowed --name "Altitude Unknown RC Configurator" fram_gui_models.py
            package_cmd: zip -j "Altitude-Unknown-RC-Configurator-Raspberry-Pi-ARM64.zip" "dist/Altitude Unknown RC Configurator"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk zip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Set up Arduino CLI for receiver flashing tool
        uses: arduino/setup-arduino-cli@v2

      - name: Stage native BOSSA receiver flashing tool
        shell: bash
        run: |
          arduino-cli core update-index --additional-urls https://adafruit.github.io/arduino-board-index/package_adafruit_index.json
          arduino-cli core install adafruit:samd@1.7.10 --additional-urls https://adafruit.github.io/arduino-board-index/package_adafruit_index.json
          BOSSAC_PATH="$(find "$HOME" -type f \( -name bossac -o -name bossac.exe \) -path '*/packages/adafruit/tools/bossac/*' | head -n 1)"
          test -n "$BOSSAC_PATH" -a -f "$BOSSAC_PATH"
          mkdir -p tools
          if [[ "$BOSSAC_PATH" == *.exe ]]; then cp "$BOSSAC_PATH" tools/bossac.exe; else cp "$BOSSAC_PATH" tools/bossac; fi

      - name: Require Apple signing secrets
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          missing=0
          for name in MACOS_CERTIFICATE_BASE64 MACOS_CERTIFICATE_PASSWORD MACOS_KEYCHAIN_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required for a macOS release that users can open normally."
              missing=1
            fi
          done
          exit "$missing"

      - name: Import Apple Developer ID certificate
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"

          echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          DETECTED_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)"
          if [ -z "$DETECTED_IDENTITY" ]; then
            echo "::error::No Developer ID Application identity found in imported certificate."
            exit 1
          fi
          echo "APPLE_DETECTED_SIGNING_IDENTITY=$DETECTED_IDENTITY" >> "$GITHUB_ENV"

      - name: Build app
        run: ${{ matrix.build_cmd }}

      - name: Sign and notarize macOS app
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          codesign --force --deep --options runtime --timestamp --sign "$APPLE_DETECTED_SIGNING_IDENTITY" "${{ matrix.app_path }}"
          codesign --verify --deep --strict --verbose=2 "${{ matrix.app_path }}"

          ditto -c -k --sequesterRsrc --keepParent "${{ matrix.app_path }}" "notary-submit-${{ matrix.asset_name }}"
          xcrun notarytool submit "notary-submit-${{ matrix.asset_name }}" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait
          xcrun stapler staple "${{ matrix.app_path }}"
          xcrun stapler validate "${{ matrix.app_path }}"

      - name: Package app
        run: ${{ matrix.package_cmd }}

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          if-no-files-found: error

  firmware:
    name: Build RC firmware
    runs-on: ubuntu-latest
    steps:
      - name: Check out transmitter repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install cores and libraries
        shell: bash
        run: |
          arduino-cli core update-index --additional-urls https://adafruit.github.io/arduino-board-index/package_adafruit_index.json,https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core install adafruit:samd@1.7.10 --additional-urls https://adafruit.github.io/arduino-board-index/package_adafruit_index.json
          arduino-cli core install esp32:esp32@3.3.10 --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli lib install "RadioHead" "Adafruit GFX Library" "Adafruit SSD1306" "FlashStorage_SAMD"

      - name: Compile both transmitter processors
        shell: bash
        run: |
          arduino-cli compile --output-dir firmware-build/samd \
            --fqbn adafruit:samd:adafruit_feather_m0_express \
            --build-property 'build.usb_product="Altitude RC TX M0"' \
            --build-property 'build.usb_manufacturer="Altitude Unknown"' \
            --build-property build.vid=0x03EB \
            --build-property build.pid=0x2402 \
            --build-property 'build.extra_flags=-D__SAMD21G18A__ -DARDUINO_SAMD_FEATHER_M0 -DARDUINO_SAMD_ZERO -DARM_MATH_CM0PLUS -DALTITUDE_RC_TX_M0 {build.usb_flags}' \
            PCB/TxV3/TxV3_Full_M0
          arduino-cli compile --output-dir firmware-build/esp --fqbn esp32:esp32:esp32c3 --board-options CDCOnBoot=cdc PCB/TxV3/TxV3_Buddy_ESP32
          arduino-cli compile --output-dir firmware-build/rx \
            --fqbn adafruit:samd:adafruit_feather_m0 rx_firmware

      - name: Package firmware and checksums
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          SAMD_BIN="$(find firmware-build/samd -name '*.bin' ! -name '*.with_bootloader.bin' | head -n 1)"
          ESP_BIN="$(find firmware-build/esp -name '*.merged.bin' | head -n 1)"
          RX_BIN="$(find firmware-build/rx -name '*.bin' ! -name '*.with_bootloader.bin' | head -n 1)"
          test -n "$SAMD_BIN" -a -f "$SAMD_BIN"
          test -n "$ESP_BIN" -a -f "$ESP_BIN"
          test -n "$RX_BIN" -a -f "$RX_BIN"
          python tools/package_transmitter_firmware.py --samd-bin "$SAMD_BIN" --esp-merged-bin "$ESP_BIN" --receiver-bin "$RX_BIN" --version "$RELEASE_VERSION" --output firmware-assets

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rc-firmware
          path: firmware-assets/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [build, firmware]
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Determine release tag
        id: release_tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        shell: bash
        run: |
          release_notes="Altitude Unknown RC Configurator builds for macOS ARM64, Windows x64, and Raspberry Pi OS ARM64, plus checksum-verified Altitude Unknown Transmitter V3 and receiver firmware. The configurator supports transmitter UF2/ESP flashing, newer RCRXBOOT receiver UF2 flashing, and automatic BOSSA fallback for original Receiver V4 hardware. This release also makes the Firmware Update tab scrollable so its flash button remains reachable on smaller or scaled displays. Keep the aircraft powered off, remove the propeller, rebind receivers after updating, and verify all controls and failsafe behavior."
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Altitude Unknown RC Configurator ${RELEASE_TAG#transmitter-gui-v}" \
              --notes "$release_notes"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Altitude Unknown RC Configurator ${RELEASE_TAG#transmitter-gui-v}" \
              --notes "$release_notes"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
